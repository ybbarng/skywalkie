<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 앱을 열 때 잠깐 뜨는 그림. 바탕은 앱 설정이 칠한다 -->
  <defs>
    <linearGradient id="wingLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC08C"/>
