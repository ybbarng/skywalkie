<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    안드로이드 앞면. 뒷면 위에 얹힌다.

    폰마다 아이콘 모양(동그라미·네모·물방울)이 달라 시스템이 잘라낸다.
    그래서 중요한 것은 가운데 66% 안전 영역 안에 둔다.
    (docs/07-design-system.md 7장)
  -->
  <defs>
    <linearGradient id="wingLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC08C"/>
      <stop offset="100%" stop-color="#FF9D5C"/>
    </linearGradient>
    <linearGradient id="wingRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F08234"/>
      <stop offset="100%" stop-color="#D4661F"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="#5CC8FF" stroke-linecap="round">
    <path d="M370 456a140 140 0 0 0 0 152" stroke-width="20" opacity="0.5"/>
    <path d="M654 456a140 140 0 0 1 0 152" stroke-width="20" opacity="0.5"/>
  </g>

  <g>
    <path d="M512 352 L512 610 L394 668 Z" fill="url(#wingLeft)"/>
    <path d="M512 352 L630 668 L512 610 Z" fill="url(#wingRight)"/>
    <path d="M512 352 L512 610" stroke="#0B1020" stroke-width="6" opacity="0.28"/>
  </g>
</svg>
