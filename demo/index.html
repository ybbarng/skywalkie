<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skywalkie — 가상 기기 두 대</title>

<!--
  진짜 앱 코드를 브라우저에서 돌린다.

  도메인·응용·통신 규약은 순수 TypeScript 라 React Native 없이도 돈다.
  그걸 그대로 묶어서 가상 기기 두 대에 얹었다.

  흉내 내는 것은 셋뿐이다.
    · 선     — 진짜 Wi-Fi 대신 브라우저 안에서 바이트를 나른다
    · 저장소 — SQLite 대신 메모리
    · 화면   — React Native 대신 HTML

  `pnpm demo` 로 다시 묶는다.
-->

<style>
:root {
  --bg: #0B1020; --surface: #151B2E; --raised: #1E2740; --border: #2A3450;
  --text: #E8ECF5; --muted: #8B95AD; --faint: #5C6780;
  --me: #FF9D5C; --me-text: #2A1408; --peer: #5CC8FF; --peer-text: #04283D;
  --success: #4ADE80; --warning: #FBBF24; --danger: #F87171; --on-status: #0B1020;
  --page: #05070F; --chrome: #11151f;
}
body.light {
  --bg: #F6F8FC; --surface: #FFFFFF; --raised: #FFFFFF; --border: #E3E8F2;
  --text: #121826; --muted: #5D6A85; --faint: #737E92;
  --me: #C2410C; --me-text: #FFFFFF; --peer: #0369A1; --peer-text: #FFFFFF;
  --success: #16A34A; --warning: #C2600A; --danger: #DC2626; --on-status: #FFFFFF;
  --page: #E8EDF6; --chrome: #C8D2E4;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; min-height: 100vh; background: var(--page); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Malgun Gothic", "Noto Sans KR", sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: 22px 16px 56px; gap: 16px;
}

h1 { font-size: 19px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 0; text-align: center; max-width: 720px; }
.sub b { color: var(--text); }

#panel {
  display: flex; flex-wrap: wrap; gap: 7px; justify-content: center;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 11px; max-width: 900px;
}
#panel button {
  font: inherit; font-size: 12.5px; font-weight: 600;
  padding: 7px 13px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: var(--raised); color: var(--text);
}
#panel button:disabled { opacity: .35; cursor: default; }
#panel button.on { background: var(--me); color: var(--me-text); border-color: transparent; }
#panel .sep { width: 1px; background: var(--border); margin: 2px 3px; }

.stage { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
.phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.phone-label { font-size: 12px; color: var(--muted); }
.phone-label b { color: var(--text); }

.phone {
  width: 320px; height: 648px; border-radius: 40px; padding: 10px;
  background: var(--chrome); box-shadow: 0 0 0 2px var(--border), 0 20px 50px rgba(0,0,0,.45);
  position: relative;
}
.screen {
  width: 100%; height: 100%; border-radius: 31px; overflow: hidden;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column; position: relative;
}
.notch {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  width: 104px; height: 22px; border-radius: 12px; background: var(--chrome); z-index: 20;
}

.statusbar {
  height: 32px; display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 16px 2px; font-size: 11px; color: var(--muted); flex: none;
}
.linkbar {
  padding: 5px 14px; font-size: 11.5px; font-weight: 600; flex: none;
  display: flex; align-items: center; gap: 6px;
}
.linkbar.ok { background: var(--success); color: var(--on-status); }
.linkbar.bad { background: var(--danger); color: var(--on-status); }
.linkbar.idle { background: var(--raised); color: var(--muted); }
.notice.bad { padding: 6px 14px; font-size: 11.5px; background: var(--danger); color: var(--on-status); flex: none; }

.peerhead {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; border-bottom: 1px solid var(--border); flex: none;
}
.peerhead .who { flex: 1; min-width: 0; }
.peerhead .name { font-weight: 700; font-size: 14px; }
.peerhead .state { font-size: 11.5px; color: var(--muted); }

.log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; }
.log::-webkit-scrollbar { width: 0; }
.log.empty { justify-content: center; align-items: center; text-align: center; }
.log.empty b { display: block; color: var(--muted); font-size: 14px; margin-bottom: 5px; }
.log.empty span { color: var(--faint); font-size: 12px; }

.daypill { align-self: center; margin: 10px 0 6px; }
.daypill span { background: var(--surface); color: var(--muted); font-size: 11px; padding: 3px 12px; border-radius: 999px; }

.row { display: flex; align-items: flex-end; gap: 6px; margin-top: 9px; }
.row.mine { flex-direction: row-reverse; }
.bubble {
  max-width: 74%; padding: 8px 13px; border-radius: 20px;
  background: var(--peer); color: var(--peer-text);
  white-space: pre-wrap; word-break: break-word; font-size: 14px;
}
.row.mine .bubble { background: var(--me); color: var(--me-text); border-bottom-right-radius: 6px; }
.row:not(.mine) .bubble { border-bottom-left-radius: 6px; }
.row .bubble.bare, .row.mine .bubble.bare { background: none; padding: 0; border-radius: 0; }

.meta { font-size: 10px; color: var(--faint); display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.meta .wait, .meta .fail { font-size: 9.5px; }
.meta .fail { color: var(--danger); }
.meta .dot { width: 7px; height: 7px; border-radius: 4px; border: 1.5px solid var(--faint); }
.sysline { align-self: center; color: var(--faint); font-size: 11.5px; margin: 8px 0; }

.typing {
  align-self: flex-start; margin-top: 9px; background: var(--surface);
  border-radius: 20px; border-bottom-left-radius: 6px; padding: 10px 16px;
  display: flex; gap: 4px;
}
.typing i { width: 6px; height: 6px; border-radius: 3px; background: var(--muted); animation: bob 1.1s infinite; }
.typing i:nth-child(2) { animation-delay: .16s; }
.typing i:nth-child(3) { animation-delay: .32s; }
@keyframes bob { 0%,60%,100% { transform: none; } 30% { transform: translateY(-4px); } }

.composer {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 11px 13px; border-top: 1px solid var(--border); flex: none;
}
.composer .tool { background: none; border: 0; padding: 3px; cursor: pointer; color: var(--muted); display: grid; place-items: center; }
.composer input {
  flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 8px 14px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
}
.composer .send {
  width: 33px; height: 33px; border-radius: 17px; border: 0; cursor: pointer;
  background: var(--me); color: var(--me-text); display: grid; place-items: center; flex: none;
}

.connecting {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px; padding: 22px; text-align: center;
}
.connecting .dim { opacity: .45; }
.connecting h2 { font-size: 17px; margin: 0; }
.connecting p { font-size: 13px; color: var(--muted); margin: 0; white-space: pre-line; }
.connecting .action {
  margin-top: 4px; font: inherit; font-size: 13px; font-weight: 600;
  padding: 10px 20px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--me); color: var(--me-text);
}
.phasetag {
  position: absolute; bottom: 12px; font-size: 10px; color: var(--faint);
  font-family: ui-monospace, monospace; letter-spacing: .3px;
}

.drawer { border-top: 1px solid var(--border); background: var(--surface); padding: 9px 0; flex: none; }
.drawer .head { display: flex; justify-content: space-between; padding: 0 14px 5px; font-size: 11.5px; color: var(--muted); }
.drawer .head button { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; font-size: 11.5px; }
.drawer .strip { display: flex; gap: 7px; overflow-x: auto; padding: 0 14px; }
.drawer .strip::-webkit-scrollbar { height: 0; }
.drawer .strip button { background: var(--bg); border: 0; border-radius: 13px; padding: 3px; cursor: pointer; flex: none; }

.netlog {
  width: 340px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden; align-self: stretch; max-height: 648px;
  display: flex; flex-direction: column;
}
.netlog-head { padding: 10px 14px; font-size: 12.5px; font-weight: 700; border-bottom: 1px solid var(--border); flex: none; }
.events { flex: 1; overflow-y: auto; padding: 6px 0; font-family: ui-monospace, monospace; font-size: 11px; }
.ev { display: flex; gap: 8px; padding: 3px 14px; }
.ev .who { color: var(--faint); flex: none; width: 58px; }
.ev .txt { color: var(--muted); word-break: break-all; }
.ev.send .txt { color: var(--me); }
.ev.recv .txt { color: var(--peer); }
.ev.warn .txt { color: var(--danger); }
.bytes { padding: 8px 14px; font-size: 11px; color: var(--faint); border-top: 1px solid var(--border); flex: none; }

svg { display: block; }
.legend { font-size: 12px; color: var(--muted); max-width: 860px; text-align: center; }
.legend code { background: rgba(128,128,128,.14); padding: 1px 5px; border-radius: 4px; font-size: 11px; }
</style>

<h1>Skywalkie — 가상 기기 두 대</h1>
<p class="sub">
  <b>진짜 앱 코드가 돕니다.</b> 핫스팟을 켜고, 서로 찾고, 붙고, 인사하고, 말을 주고받아요.
  흉내 내는 건 선·저장소·화면 셋뿐이에요.
</p>

<div id="panel"></div>

<div class="stage">
  <div class="phone-wrap">
    <div class="phone-label">내 폰 · <b>안드로이드</b> · 핫스팟을 연다</div>
    <div class="phone"><div class="notch"></div><div class="screen" id="screen-host"></div></div>
  </div>

  <div id="netlog-slot"></div>

  <div class="phone-wrap">
    <div class="phone-label">여자친구 폰 · <b>아이폰</b> · 들어간다</div>
    <div class="phone"><div class="notch"></div><div class="screen" id="screen-guest"></div></div>
  </div>
</div>

<p class="legend">
  <b>핫스팟 켜기 → Wi-Fi 에 들어가기 → 상대 찾아 잇기</b> 순서로 눌러보세요.
  그다음 아무 쪽에나 글을 쓰면 실제로 봉투가 만들어져 건너갑니다.
  <br>
  <code>신호 끊기</code> 로 끊고 글을 쓴 뒤 <code>다시 잇기</code> 를 누르면
  <b>놓친 말을 되찾는 것</b>까지 진짜로 돕니다.
</p>

<script type="module" src="./app.js"></script>
