# 커밋하기 전에 자동으로 검사한다.
# 사람이 잊어도 도구가 막는다.

pre-commit:
  parallel: true
  jobs:
    - name: 형식과 흔한 실수
      glob: '*.{ts,tsx,js,jsx,json}'
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: 타입
      glob: '*.{ts,tsx}'
      run: pnpm typecheck

pre-push:
  jobs:
    - name: 전체 검사
      run: pnpm verify
