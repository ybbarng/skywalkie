name: 검사

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: 형식 · 타입 · 층 규칙 · 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

# 앱을 만드는 일은 여기서 하지 않는다.
# 서명 열쇠를 GitHub 에 올려야 하는데 그럴 이유가 없다.
# 릴리스는 내 컴퓨터에서 만든다. (docs/08-build-release.md 8장)
