# 올릴 때마다 검사를 돌린다.
#
# **앱을 만드는 일은 여기서 하지 않는다.** 서명 열쇠를 GitHub 에
# 올려야 하는데 그럴 이유가 없다. 열쇠를 잃으면 덮어쓰기가 안 되고,
# 그러면 앱을 지우고 다시 깔아야 하고, 그러면 대화가 날아간다.
name: 검사

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 잠금 파일에 있는 것만 깐다. 새 버전이 몰래 들어오지 않는다.
      - run: pnpm install --frozen-lockfile

      - name: 형식과 흔한 실수
        run: pnpm lint

      - name: 타입
        run: pnpm typecheck

      - name: 층 규칙
        run: pnpm check:deps

      - name: 색 토큰
        run: pnpm check:tokens

      - name: 시험
        run: pnpm test
